<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Gestion des Fiches de Poste</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        /* 🔹 Navbar */
        .navbar {
            background-color: #343a40;
            overflow: hidden;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 18px;
            display: inline-block;
        }
        .navbar a:hover {
            background-color: #575d63;
            transition: 0.3s;
        }
        /* 🔹 Contenu principal */
        .container {
            margin: 40px auto;
            width: 80%;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 18px;
            color: #666;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- 🔹 Navbar -->
    <div class="navbar">
        <a href="/view_fiches">📋 Visualisation des Fiches</a>
        <a href="/kpi">📊 Affichage des KPI</a>
        <a href="/deposer_fiche">➕ Déposer une Fiche</a>
    </div>

    <!-- 🔹 Contenu principal -->
    <div class="container">
        <h1>Bienvenue sur la Gestion des Fiches de Poste</h1>
        <p>Gérez et visualisez vos fiches de poste de manière efficace grâce à notre interface interactive.</p>

        <a href="/view_fiches" class="btn">📋 Voir les Fiches de Poste</a>
        <a href="/kpi" class="btn">📊 Consulter les KPI</a>
        <a href="/deposer_fiche" class="btn">➕ Déposer une Fiche</a>
    </div>

</body>
</html>
