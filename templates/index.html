<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Mantra</title>
    <link rel="icon" href="/static/mantra_talents_logo.jpeg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7ff;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #1e2148;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .navbar img {
            height: 50px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 10px;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #6a54d1;
        }

        h1 {
            text-align: center;
            margin-top: 40px;
            color: #1e2148;
        }

        .container {
            margin: 50px auto;
            width: 80%;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #6a54d1;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            display: inline-block;
            margin: 10px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #5942b3;
        }

        .loading-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 18px;
            z-index: 9999;
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #6a54d1;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        function redirectToFiches() {
            const loadingPopup = document.getElementById('loadingPopup');
            loadingPopup.style.display = 'flex';
            window.location.href = "/view_fiches";
        }

        window.addEventListener('pageshow', function() {
            const loadingPopup = document.getElementById('loadingPopup');
            loadingPopup.style.display = 'none';
        });
    </script>
</head>

<body>
    <div class="navbar">
        <img src="/static/mantra_talents_logo.jpeg" alt="Mantra Logo">
        <a href="/">Accueil</a>
        <a href="/view_fiches">Fiches de Poste</a>
        <a href="/kpi">KPI</a>
        <a href="/deposer_fiche">Déposer une fiche</a>
    </div>

    <div class="container">
        <h1>Bienvenue sur la Gestion des Fiches de Poste</h1>
        <p>Gérez et visualisez vos fiches de poste de manière efficace grâce à notre interface interactive.</p>

        <a href="#" class="btn" onclick="redirectToFiches()">📋 Voir les Fiches de Poste</a>
        <a href="/kpi" class="btn">📊 Consulter les KPI</a>
        <a href="/deposer_fiche" class="btn">➕ Déposer une Fiche</a>
    </div>

    <div id="loadingPopup" class="loading-popup">
        <div class="loader"></div>
        <p>Chargement en cours...</p>
    </div>
</body>
</html>
